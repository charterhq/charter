<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./boat.svg" />
    <title>Charter</title>
    <script>
      // The saved theme applies before the first paint, so a light-theme user sees no dark flash.
      try {
        if (localStorage.getItem("charter.theme") === "light") document.documentElement.classList.remove("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
