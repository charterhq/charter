<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b151f" />
    <title>Charter</title>
    <script>
      // The saved theme applies before the first paint, so a light-theme user sees no dark flash.
      try {
        if (localStorage.getItem("charter.theme") === "light") document.documentElement.classList.remove("dark");
        // The interface language is English unless the person chose another one in the profile.
        const lang = localStorage.getItem("charter.lang");
        if (lang) document.documentElement.lang = lang;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
