name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: charter
          POSTGRES_PASSWORD: charter
          POSTGRES_DB: charter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U charter" --health-interval 2s --health-retries 30
    env:
      CHARTER_TEST_DATABASE_URL: postgres://charter:charter@localhost:5432/charter?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
