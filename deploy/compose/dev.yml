# Local PostgreSQL for development and tests:
#   docker compose -f deploy/compose/dev.yml up -d
#   export CHARTER_DATABASE_URL=postgres://charter:charter@localhost:55432/charter?sslmode=disable
#   export CHARTER_TEST_CLICKHOUSE_URL=http://localhost:58123
# Keycloak for logging people in (realm charter, users jane.doe, john.roe, pat.lee, password = name):
#   docker compose -f deploy/compose/dev.yml --profile oidc up -d --wait
#   export CHARTER_OIDC_ISSUER=http://localhost:58080/realms/charter CHARTER_OIDC_CLIENT_ID=charter
#   export CHARTER_OIDC_CLIENT_SECRET=charter-dev-secret CHARTER_PUBLIC_URL=http://localhost:8080/
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: charter
      POSTGRES_PASSWORD: charter
      POSTGRES_DB: charter
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charter"]
      interval: 2s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: charter
      CLICKHOUSE_PASSWORD: charter
    volumes:
      - ../clickhouse/config.d/charter.xml:/etc/clickhouse-server/config.d/charter.xml:ro
      - ../clickhouse/users.d/charter.xml:/etc/clickhouse-server/users.d/charter.xml:ro
    # ClickHouse reads the cgroup limit and caps its own memory at 90% of it.
    mem_limit: 1g
    ports:
      - "58123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 2s
      retries: 60
  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=58080", "--hostname=http://localhost:58080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/charter-realm.json:/opt/keycloak/data/import/charter-realm.json:ro
    ports:
      - "127.0.0.1:58080:58080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 3s
      retries: 60
